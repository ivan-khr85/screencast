name: Release macOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG_V=$(node -p "require('./package.json').version")
          TAG_V=${GITHUB_REF_NAME#v}
          if [ "$PKG_V" != "$TAG_V" ]; then
            echo "::error::Tag $GITHUB_REF_NAME != package.json version $PKG_V"
            exit 1
          fi

      - run: npm ci

      - name: Build (tsc + electron bundle + swift sc-audio + assets)
        run: npm run build

      - name: Package .dmg / .zip
        run: npx electron-builder --mac --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip
          generate_release_notes: true

      - name: Upload artifacts (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: icast-mac-arm64
          path: |
            release/*.dmg
            release/*.zip
