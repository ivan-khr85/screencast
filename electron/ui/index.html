<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screencast</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="titlebar">Screencast</div>

<div class="container">

  <!-- First-run setup (shown when dependencies are missing) -->
  <div id="setup" class="hidden">
    <div class="section">
      <div class="section-title" data-i18n="ui.setup.title">Setup Required</div>
      <ul id="setup-checklist" class="setup-checklist"></ul>
      <div class="setup-actions">
        <button id="setup-install" class="btn-small btn-accent">Install missing</button>
        <button id="setup-recheck" class="btn-small" data-i18n="ui.setup.recheck">Re-check</button>
      </div>
      <div id="setup-log" class="setup-log hidden" aria-live="polite"></div>
    </div>
  </div>

  <!-- Settings -->
  <div id="settings">
    <div class="section">
      <div class="section-title" data-i18n="ui.settings.title">Settings</div>
      <div class="field">
        <label for="langSelect" data-i18n="common.language">Language</label>
        <select id="langSelect">
          <option value="en">English</option>
          <option value="uk">Українська</option>
        </select>
      </div>
      <div class="field">
        <label for="screenSelect" data-i18n="ui.settings.display">Display</label>
        <select id="screenSelect">
          <option value="0" data-i18n="ui.settings.mainScreen">Main Screen</option>
        </select>
      </div>
      <img id="displayThumb" class="display-thumb hidden" alt="Preview of selected display" data-i18n-alt="ui.info.displayPreview">
      <div class="field">
        <label for="port" data-i18n="ui.settings.port">Port</label>
        <input type="number" id="port" value="8080" min="1024" max="65535">
      </div>
      <div class="field">
        <label for="fps" data-i18n="ui.settings.fps">FPS</label>
        <input type="number" id="fps" value="30" min="1" max="120">
      </div>
      <div class="field">
        <label for="quality" data-i18n="ui.settings.quality">Quality</label>
        <select id="quality">
          <option value="100750k" selected data-i18n="ui.settings.qMax">Maximum (LAN)</option>
          <option value="20000k" data-i18n="ui.settings.qHigh">High (remote)</option>
          <option value="8000k" data-i18n="ui.settings.qMedium">Medium</option>
          <option value="3000k" data-i18n="ui.settings.qLow">Low</option>
          <option value="custom" data-i18n="ui.settings.qCustom">Custom&hellip;</option>
        </select>
      </div>
      <div class="field hidden" id="bitrateField">
        <label for="bitrate" data-i18n="ui.settings.bitrate">Bitrate</label>
        <input type="text" id="bitrate" value="100750k" placeholder="e.g. 8000k" data-i18n-placeholder="ui.settings.bitratePh">
      </div>
      <div class="field">
        <label for="password" data-i18n="ui.settings.password">Password</label>
        <span class="input-group">
          <input type="text" id="password" placeholder="blank = auto" data-i18n-placeholder="ui.settings.passwordPh">
          <button id="genPassword" class="btn-inline" aria-label="Generate password" title="Generate password" data-i18n-aria-label="ui.settings.genPassword" data-i18n-title="ui.settings.genPassword">&#8635;</button>
        </span>
      </div>
      <div class="field">
        <label for="maxViewers" data-i18n="ui.settings.maxViewers">Max Viewers</label>
        <input type="number" id="maxViewers" value="5" min="1" max="50">
      </div>
      <div class="field">
        <label for="audioMode" data-i18n="ui.settings.audio">Audio</label>
        <select id="audioMode">
          <option value="system" selected data-i18n="ui.settings.audioSystem">System Audio</option>
          <option value="app" data-i18n="ui.settings.audioApp">App Audio</option>
          <option value="none" data-i18n="ui.settings.audioNone">No Audio</option>
        </select>
      </div>
      <div class="field hidden" id="audioAppField">
        <label for="audioApp" data-i18n="ui.settings.app">App</label>
        <select id="audioApp">
          <option value="">Select app...</option>
        </select>
      </div>
      <div class="field">
        <span class="field-label" id="tunnel-label" data-i18n="ui.settings.tunnel">Public Tunnel</span>
        <label class="toggle">
          <input type="checkbox" id="tunnel" checked aria-labelledby="tunnel-label">
          <span class="slider"></span>
        </label>
      </div>
      <div id="tunnel-note" class="field-note hidden" data-i18n="ui.settings.tunnelNote">Install cloudflared to enable public sharing</div>
      <div class="field">
        <span class="field-label" id="chat-label" data-i18n="ui.chat">Chat</span>
        <label class="toggle">
          <input type="checkbox" id="chat" checked aria-labelledby="chat-label">
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </div>

  <!-- Control Button -->
  <button id="startBtn" class="btn btn-start">
    Start Stream
  </button>
  <div id="start-hint" class="start-hint hidden"></div>

  <div id="error" class="error hidden" aria-live="polite"></div>

  <!-- Stream Info (shown when streaming) -->
  <div id="stream-info" class="hidden">
    <div id="stream-warning" class="stream-warning hidden" aria-live="polite">
      <span id="stream-warning-text"></span>
      <button id="stream-warning-dismiss" aria-label="Dismiss warning" data-i18n-aria-label="ui.info.dismissWarning">&times;</button>
    </div>

    <div class="section section-gap">
      <div class="section-title" data-i18n="ui.info.title">Stream Info</div>
      <div class="info-row">
        <span class="info-label" data-i18n="ui.info.url">URL</span>
        <span id="stream-url" class="info-value"></span>
        <button class="btn-copy" data-copy="url" data-i18n="common.copy">Copy</button>
      </div>
      <div id="tunnel-badge" class="tunnel-badge hidden"></div>
      <div class="info-row">
        <span class="info-label" data-i18n="ui.info.password">Password</span>
        <span id="stream-password" class="info-value"></span>
        <button class="btn-copy" data-copy="password" data-i18n="common.copy">Copy</button>
      </div>
      <div class="info-row info-row-center">
        <button class="btn-copy btn-copy-accent" data-copy="link" data-i18n="ui.info.copyLink">Copy Link (auto-connect)</button>
        <button class="btn-copy" id="qr-toggle">Show QR</button>
      </div>
      <div id="qr-block" class="qr-block hidden">
        <canvas id="qr-canvas" width="220" height="220" role="img" aria-label="QR code for stream link" data-i18n-aria-label="ui.info.qrAria"></canvas>
        <label class="qr-include">
          <input type="checkbox" id="qr-include-password" checked>
          <span data-i18n="ui.info.qrInclude">Include password (auto-connect)</span>
        </label>
      </div>
    </div>

    <div class="section">
      <div class="viewers-display" role="status">
        <div id="viewer-count" class="viewers-count">0 / 5</div>
        <div class="viewers-label" data-i18n="ui.info.viewers">Viewers</div>
      </div>
      <div class="field field-gap">
        <span class="field-label" id="chat-live-label" data-i18n="ui.chat">Chat</span>
        <label class="toggle">
          <input type="checkbox" id="chat-live-toggle" checked aria-labelledby="chat-live-label">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- Host chat panel -->
    <div class="section" id="chat-section">
      <button id="chat-header" class="chat-header" aria-expanded="false">
        <span class="chat-header-title" data-i18n="ui.chat">Chat</span>
        <span id="chat-unread" class="chat-unread hidden">0</span>
        <span class="chat-chevron" aria-hidden="true">&#9662;</span>
      </button>
      <div id="chat-body" class="hidden">
        <div id="chat-messages" class="chat-messages" role="log" aria-live="polite"></div>
        <div class="chat-input-row">
          <input type="text" id="chat-input" placeholder="Message viewers..." maxlength="500" aria-label="Chat message" data-i18n-placeholder="ui.chatPanel.messagePh" data-i18n-aria-label="ui.chatPanel.messageAria">
          <button id="chat-send" class="btn-small btn-accent" data-i18n="common.send">Send</button>
        </div>
      </div>
    </div>

    <div id="audio-note" class="audio-note hidden" data-i18n="ui.info.audioNote">
      Audio capture unavailable
    </div>
  </div>

</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="vendor/qrcode.js"></script>
<script src="vendor/i18next.min.js"></script>
<script src="i18n-dom.js"></script>
<script src="app.js"></script>
</body>
</html>
