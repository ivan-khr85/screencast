<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; media-src 'self' blob:">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Screen Stream</title>
<link rel="stylesheet" href="/viewer.css">
</head>
<body>

<div id="auth-screen">
  <h1 data-i18n="viewer.title">Screen Stream</h1>
  <form id="auth-form">
    <input type="text" id="password-input" placeholder="Enter password" autocomplete="off" autofocus aria-label="Stream password" data-i18n-placeholder="viewer.auth.passwordPh" data-i18n-aria-label="viewer.auth.passwordAria">
    <button type="submit" id="auth-submit">Connect</button>
    <div id="auth-error" role="alert"></div>
  </form>
  <select class="lang-select" id="auth-lang" aria-label="Language" data-i18n-aria-label="common.language">
    <option value="en">English</option>
    <option value="uk">Українська</option>
  </select>
</div>

<!-- Everything that must stay visible in fullscreen lives inside #player-screen:
     requestFullscreen() is called on this element, so fixed-position children
     keep rendering while the rest of the document is hidden. -->
<div id="player-screen">
  <video id="video" autoplay muted playsinline></video>

  <div id="loading-overlay" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <div id="loading-text">Waiting for video&hellip;</div>
  </div>

  <div id="stream-overlay">
    <div id="overlay-title">Stream has ended</div>
    <div id="overlay-message"></div>
    <button id="overlay-retry" data-i18n="viewer.overlay.reconnect">Reconnect</button>
  </div>

  <div id="controls" role="group" aria-label="Player controls" data-i18n-aria-label="viewer.controls.group">
    <span id="audio-controls">
      <button id="mute-toggle" class="ctrl-btn" aria-label="Unmute">
        <svg id="icon-muted" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
        <svg id="icon-unmuted" aria-hidden="true" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      </button>
      <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1" aria-label="Volume" data-i18n-aria-label="viewer.controls.volume">
    </span>
    <button id="stats-toggle" class="ctrl-btn" aria-label="Show statistics">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    </button>
    <button id="pip-toggle" class="ctrl-btn" aria-label="Picture in picture" data-i18n-aria-label="viewer.controls.pip">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><rect x="12" y="12" width="8" height="6" rx="1" fill="currentColor" stroke="none"/></svg>
    </button>
    <button id="fullscreen-toggle" class="ctrl-btn" aria-label="Fullscreen">
      <svg id="icon-fs-enter" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      <svg id="icon-fs-exit" aria-hidden="true" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>
    </button>
    <select class="lang-select ctrl-lang" id="controls-lang" aria-label="Language" data-i18n-aria-label="common.language">
      <option value="en">EN</option>
      <option value="uk">УКР</option>
    </select>
  </div>

  <div id="status" role="status" aria-live="polite"></div>
  <div id="stream-stats"></div>
  <div id="error-toasts" aria-live="assertive"></div>

  <button id="chat-toggle" aria-label="Chat" data-i18n-aria-label="viewer.chat.open">
    <span aria-hidden="true">&#128172;</span>
    <span class="badge" id="chat-badge"></span>
  </button>
  <div id="chat-panel">
    <div id="chat-resize-handle" aria-hidden="true"></div>
    <div id="chat-name-row">
      <input type="text" id="chat-name-input" placeholder="Enter your name..." maxlength="30" autocomplete="off" aria-label="Chat name" data-i18n-placeholder="viewer.chat.namePh" data-i18n-aria-label="viewer.chat.nameAria">
      <button id="chat-name-btn" data-i18n="viewer.chat.join">Join</button>
    </div>
    <div id="chat-name-error" role="alert"></div>
    <div id="chat-messages" role="log" aria-live="polite"></div>
    <div id="chat-input-row" style="display:none;">
      <input type="text" id="chat-input" placeholder="Send a message..." maxlength="500" autocomplete="off" aria-label="Chat message" data-i18n-placeholder="viewer.chat.messagePh" data-i18n-aria-label="viewer.chat.messageAria">
      <button id="chat-send" data-i18n="common.send">Send</button>
    </div>
  </div>
</div>

<script src="/vendor/i18next.min.js"></script>
<script src="/i18n-dom.js"></script>
<script src="/viewer.js"></script>
</body>
</html>
